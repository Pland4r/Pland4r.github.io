name: Build and deploy

on:
  push:
    branches: [main]
  # Lets you redeploy from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: write      # the asset step commits what it generates
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling, so a push that
# lands mid-deploy still ends up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ffmpeg encodes the product clips; the rest is Pillow/numpy/scipy.
      - name: Install asset toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet pillow numpy scipy

      # Discovers every photo in pic/. Anything whose output is already newer
      # than its photo is skipped, so a normal code push costs seconds here and
      # only a genuinely new photo triggers a render.
      - name: Build product assets
        run: python -u scripts/assets.py

      - name: Commit any new assets
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "no new assets"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # [skip ci] because this run already deploys what it just generated.
          git commit -m "Build assets for new photos [skip ci]"
          git push

      - name: Install
        run: npm ci

      - name: Build static site
        run: npm run build

      # Belt and braces: Pages served from an artifact does not run Jekyll, but
      # without this a future change of source would silently drop /_next/.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
