name = "ma-cases-assistant"
main = "index.js"
compatibility_date = "2026-10-01"

# The account the Worker lives in. Without it a login that can see more than one
# account cannot pick, and the deploy stops to ask. An account id is not a
# secret — it is in the dashboard URL.
account_id = "b8c9c6e737752e4aed8b0e9ff513b646"

# The API key is NOT here. It is a secret, set once with:
#   npx wrangler secret put OLLAMA_API_KEY
# Anything in this file is in git; a secret is not.

[vars]
OLLAMA_MODEL = "gemma4:31b"
